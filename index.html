<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Aurelia Liberty Racing</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:ital,wdth,wght@0,62..125,400..900;1,62..125,700..900&family=Bodoni+Moda:ital,wght@0,500;0,700;1,500;1,700&family=Italiana&family=Josefin+Sans:wght@600&family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
/* VOICE: MO1 위성팀 공식 사이트, 단정한 기업 톤, 3개 언어
   IDEA: 리버티 머신 카울 — 흰 카울, 크레마 골드, 사선 컷
   PICTURE: 레이스 위크 히어로와 페이지별 이미지 헤더, ZP-26 머신
   COLOUR+TYPE: 그래파이트, 흰색, 샴페인 골드, LIVE에만 빨강 / Archivo 확장 이탤릭 + Noto Sans KR
   LAYOUT: 유틸바(언어) → 메인 내비 → 하위 메뉴 → 페이지 → 파트너 띠 → 푸터 */


:root{color-scheme:light dark;
--bg:light-dark(#ffffff,#111215);--ink:light-dark(#17191d,#eeede9);--soft:light-dark(#62666e,#9fa3aa);
--line:light-dark(#e2e2df,#2a2c31);--panel:light-dark(#f3f3f1,#1a1b1f);
--gold:light-dark(#937a47,#cdb588);--champ:#d9c294;--graph:#1b1d21;--red:#c8202c}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
html{scroll-padding-top:80px}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.65 "Noto Sans KR",system-ui,sans-serif;overflow-x:clip}
img{display:block;max-width:100%}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--champ);outline-offset:2px}
.w{font-family:Archivo,"Noto Sans KR",sans-serif;font-stretch:125%;font-weight:900;font-style:italic;letter-spacing:-.01em}
.wrap{max-width:1320px;margin:0 auto;padding:0 max(4vw,16px)}
.band{padding:clamp(52px,6.5vw,96px) 0}
.head{display:flex;flex-wrap:wrap;align-items:end;justify-content:space-between;gap:12px 24px;margin-bottom:30px}
.head h2{margin:0;font-size:clamp(30px,4vw,48px);line-height:1.05;font-weight:900}
.head h2 small,.eb{display:block;font-family:Archivo,sans-serif;font-stretch:125%;font-style:italic;font-weight:800;font-size:15px;color:var(--gold);margin-bottom:8px}
.more{font-weight:700;font-size:15px;border-bottom:2px solid var(--champ);padding:6px 0;cursor:pointer}
.dark{background:var(--graph);color:#ecebe7}
.dark .head h2 small,.dark .eb{color:var(--champ)}
.panel{background:var(--panel)}
[data-view]{display:none}[data-view].on{display:block}

/* utility + nav */
.lang{display:flex;gap:2px;align-items:center}.lang a{padding:4px 8px;font-weight:700;color:#a9aab0}.lang a.cur{color:#1b1d21;background:var(--champ)}

.util{background:var(--graph);color:#a9aab0;font-size:13px}
.util .wrap{display:flex;justify-content:space-between;gap:16px;height:34px;align-items:center}.util .mo{margin-left:auto}
.util b{color:var(--champ);font-weight:700}
nav{position:sticky;top:0;z-index:30;background:var(--bg);border-bottom:1px solid var(--line)}
nav .wrap{display:flex;align-items:center;gap:24px;height:72px}
.logo{display:flex;align-items:center;gap:12px;flex:none}
.mark{width:42px;height:42px;background:var(--graph);clip-path:polygon(22% 0,100% 0,78% 100%,0 100%);display:grid;place-items:center;color:var(--champ);font-size:21px}
.logo .w{font-size:21px;line-height:1;font-style:normal;display:block}
.logo small{display:block;font-family:"Bodoni Moda",serif;font-size:12px;color:var(--gold);margin-top:4px;font-weight:500}
.logo .mark{display:grid;font-size:21px;font-style:italic}
.menu{display:flex;gap:0;margin-left:auto}
.menu a{flex:none;font-weight:700;font-size:15px;padding:12px 13px;position:relative;color:var(--soft)}
.menu a.cur,.menu a:hover{color:var(--ink)}
.menu a::after{content:"";position:absolute;left:13px;right:13px;bottom:2px;height:3px;background:var(--champ);transform:scaleX(0);transition:transform .2s}
.menu a.cur::after,.menu a:hover::after{transform:scaleX(1)}
.burger{display:none;margin-left:auto;min-width:48px;min-height:44px;border:1px solid var(--line);background:var(--bg);font-weight:700;cursor:pointer}
.cta{flex:none;background:var(--graph);color:#fff;font-weight:700;font-size:14px;padding:11px 18px;clip-path:polygon(8% 0,100% 0,92% 100%,0 100%)}

/* hero */
.hero{position:relative;background:var(--graph);color:#fff;overflow:hidden;min-height:min(86vh,780px);display:grid}
.hero>img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:62% 14%}
.hero::before{content:"";position:absolute;inset:0;z-index:1;background:linear-gradient(90deg,rgba(20,21,24,.94) 0%,rgba(20,21,24,.6) 42%,rgba(20,21,24,0) 72%),linear-gradient(0deg,rgba(20,21,24,.88),transparent 45%)}
.hero .wrap{position:relative;z-index:2;width:100%;display:grid;grid-template-rows:1fr auto;padding-top:clamp(48px,7vw,100px);padding-bottom:28px}
.live{display:inline-flex;align-items:center;gap:8px;font-weight:700;font-size:14px;background:var(--red);padding:5px 12px;width:max-content}
.live::before{content:"";width:8px;height:8px;border-radius:50%;background:#fff;animation:blink 1.4s infinite}
@keyframes blink{50%{opacity:.25}}
.hero h1{font-size:clamp(44px,7.4vw,108px);line-height:.9;margin:18px 0}
.hero h1 span{color:var(--champ)}
.hero p{max-width:40ch;font-size:clamp(17px,1.5vw,19px);color:#d7d6d1;margin:0 0 26px}
.btns{display:flex;flex-wrap:wrap;gap:10px}
.btn{display:inline-flex;align-items:center;min-height:48px;padding:0 26px;font-weight:700;background:var(--champ);color:#1b1d21;clip-path:polygon(6% 0,100% 0,94% 100%,0 100%);border:0;cursor:pointer}
.btn.ghost{background:rgba(255,255,255,.12);color:#fff}
.nextw{margin-top:40px;display:grid;grid-template-columns:auto minmax(0,1fr) repeat(3,minmax(0,150px));background:rgba(20,21,24,.82);backdrop-filter:blur(8px);border-top:3px solid var(--champ)}
.nextw>div{padding:16px 20px;border-left:1px solid rgba(255,255,255,.1)}
.nextw>div:first-child{border-left:0}
.nextw small{display:block;font-size:13px;color:#a9aab0}
.nextw b{font-size:17px}
.nextw .dd{font-size:34px;line-height:1;color:var(--champ)}
.nextw .day b{font-size:15px}

/* page header */
.ph{position:relative;background:var(--graph);color:#fff;overflow:hidden}
.ph img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:60% 20%;opacity:.42}
.ph::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(20,21,24,.95),rgba(20,21,24,.3))}
.ph .wrap{position:relative;z-index:1;padding-top:clamp(48px,6vw,88px);padding-bottom:clamp(36px,4vw,56px)}
.crumb{font-size:13px;color:#a9aab0;margin-bottom:12px}
.crumb a:hover{color:var(--champ)}
.ph h1{margin:0;font-size:clamp(38px,6vw,80px);line-height:.95}
.ph p{margin:14px 0 0;max-width:60ch;color:#cfcec9;font-size:17px}

/* news */
.ngrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:28px 24px}
.nc{display:flex;flex-direction:column;gap:10px;cursor:pointer}
.nc .im{aspect-ratio:16/10;overflow:hidden;background:var(--panel)}
.nc img{width:100%;height:100%;object-fit:cover;object-position:50% 22%;transition:transform .5s}
.nc:hover img{transform:scale(1.04)}
.nc h3{margin:0;font-size:19px;line-height:1.4}
.nc p{margin:0;color:var(--soft);font-size:15px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.nc.big{grid-column:span 2;grid-row:span 2}
.nc.big .im{aspect-ratio:16/11}
.nc.big h3{font-size:clamp(22px,2.4vw,30px)}
.cat{font-size:13px;font-weight:700;color:var(--gold)}
.cat time{color:var(--soft);font-weight:500;margin-left:10px}
.art{max-width:760px;margin:0 auto}
.art .lead{font-size:20px;line-height:1.6;font-weight:500;margin:0 0 24px}
.art p{margin:0 0 18px;font-size:17px;line-height:1.8}
.art figure{margin:0 0 28px}
.art figure img{width:100%;max-height:520px;object-fit:cover;object-position:50% 22%}
.art figcaption{font-size:13px;color:var(--soft);margin-top:8px}
blockquote{margin:28px 0;padding:4px 0 4px 22px;border-left:4px solid var(--champ);font-size:20px;line-height:1.6;font-weight:700}
blockquote cite{display:block;font-size:14px;font-style:normal;font-weight:500;color:var(--soft);margin-top:8px}
.back{display:inline-flex;min-height:44px;align-items:center;font-weight:700;border-bottom:2px solid var(--champ);margin-top:12px}

/* riders */
.rgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:24px}
.rc{position:relative;aspect-ratio:4/5;max-height:620px;width:100%;overflow:hidden;background:linear-gradient(160deg,#2b2e34,#16171a);color:#fff;display:flex;align-items:end;text-align:left;border:0;padding:0}
.rc img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:50% 15%;transition:transform .6s}
a.rc:hover img{transform:scale(1.03)}
.rc::before{content:"";position:absolute;inset:0;background:linear-gradient(0deg,rgba(18,19,22,.95),rgba(18,19,22,0) 52%);z-index:1}
.rc .no{position:absolute;right:18px;top:6px;z-index:1;font-size:clamp(90px,12vw,170px);line-height:1;color:transparent;-webkit-text-stroke:2px rgba(217,194,148,.85)}
.rc .t{position:relative;z-index:2;padding:clamp(20px,3vw,32px);width:100%}
.rc .t small{color:var(--champ);font-weight:700;font-size:14px}
.rc h3{font-size:clamp(34px,4.6vw,60px);line-height:.92;margin:8px 0 14px}
.rc .go{font-weight:700;font-size:15px;border-bottom:2px solid var(--champ);padding-bottom:3px}
.rc .q{position:absolute;inset:0;display:grid;place-items:center;font-size:clamp(160px,22vw,300px);color:rgba(255,255,255,.06)}
.kpis{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));border-top:2px solid currentColor}
.kpis div{padding:18px 16px 18px 0;border-bottom:1px solid var(--line)}
.dark .kpis div{border-color:#33363c}
.kpis small{display:block;font-size:13px;color:var(--soft)}
.dark .kpis small{color:#a9aab0}
.kpis b{font-size:clamp(26px,3vw,38px);line-height:1.1}
.two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:clamp(28px,4vw,64px)}
.dl{margin:0;display:grid;border-top:2px solid var(--ink)}
.dl div{display:grid;grid-template-columns:8.5em minmax(0,1fr);gap:16px;padding:14px 0;border-bottom:1px solid var(--line)}
.dl dt{color:var(--soft);font-size:15px}
.dl dd{margin:0;font-weight:700}
.dark .dl{border-color:#ecebe7}.dark .dl div{border-color:#33363c}.dark .dl dt{color:#a9aab0}
.tl{list-style:none;margin:0;padding:0;border-left:2px solid var(--line)}
.tl li{position:relative;padding:0 0 22px 24px}
.tl li::before{content:"";position:absolute;left:-7px;top:6px;width:12px;height:12px;background:var(--champ);clip-path:polygon(25% 0,100% 0,75% 100%,0 100%)}
.tl time{display:block;font-family:Archivo,sans-serif;font-weight:800;color:var(--gold)}
.tl b{display:block;font-size:17px}
.tl p{margin:2px 0 0;color:var(--soft);font-size:15px}
.gal{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px}
.gal button{all:unset;cursor:pointer;aspect-ratio:640/935;overflow:hidden;background:var(--panel)}
.gal button:first-child{grid-column:span 2;grid-row:span 2;aspect-ratio:auto}
.gal img{width:100%;height:100%;object-fit:cover;transition:transform .5s}
.gal button:hover img{transform:scale(1.04)}
.gal button:focus-visible{outline:3px solid var(--champ);outline-offset:2px}
.lb{position:fixed;inset:0;z-index:60;background:rgba(10,11,13,.94);display:none;place-items:center;padding:60px 16px 24px}
.lb.on{display:grid}
.lb img{max-height:84vh;width:auto;max-width:100%}
.lb button{position:absolute;background:none;border:0;color:#fff;font-weight:700;min-width:48px;min-height:48px;cursor:pointer;padding:8px 14px}
.lb .x{top:8px;right:8px}.lb .pv,.lb .nx{top:50%;transform:translateY(-50%);font-size:34px}.lb .pv{left:4px}.lb .nx{right:4px}

/* team */
.state{font-size:clamp(21px,2.3vw,28px);line-height:1.55;font-weight:500;margin:0 0 24px}
.phase{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:0;border-top:2px solid var(--ink)}
.phase div{padding:20px 20px 20px 0;border-right:1px solid var(--line)}
.phase div+div{padding-left:20px}
.phase div:last-child{border-right:0}
.phase .n{font-family:Archivo,sans-serif;font-stretch:125%;font-style:italic;font-weight:900;font-size:40px;line-height:1;color:var(--champ)}
.phase b{display:block;font-size:18px;margin:10px 0 4px}
.phase p{margin:0;color:var(--soft);font-size:15px}
.staff{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:0;border-top:2px solid var(--ink)}
.staff div{padding:20px 20px 20px 0;border-bottom:1px solid var(--line)}
.staff small{color:var(--gold);font-weight:700;font-size:13px}
.staff b{display:block;font-size:19px;margin:2px 0}
.staff span{display:block;font-size:13px;color:var(--soft);font-family:Archivo,sans-serif}
.staff p{margin:8px 0 0;color:var(--soft);font-size:15px;max-width:34ch}
.mach{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:clamp(28px,4vw,56px);align-items:center}
.mach .pic{position:relative}
.mach .pic img{width:100%;clip-path:polygon(0 0,100% 0,100% 88%,92% 100%,0 100%)}
.sw{display:flex;gap:14px;flex-wrap:wrap;margin-top:22px}
.sw span{display:flex;align-items:center;gap:8px;font-size:14px;color:#cfcec9}
.sw i{width:28px;height:28px;border:1px solid #4a4d55}

/* results */
.tabs{display:flex;gap:4px;flex-wrap:wrap}
.tabs button{min-height:44px;padding:0 18px;border:1px solid var(--line);background:var(--bg);font-weight:700;font-size:15px;cursor:pointer}
.tabs button[aria-pressed=true]{background:var(--graph);color:#fff;border-color:var(--graph)}
.res{width:100%;border-collapse:collapse;border-top:2px solid var(--ink)}
.res th{white-space:nowrap;text-align:left;font-size:13px;color:var(--soft);font-weight:700;padding:12px 10px;border-bottom:1px solid var(--line)}
.res td{padding:14px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
.res .num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.res .r{font-family:Archivo,sans-serif;font-stretch:125%;font-style:italic;font-weight:900;font-size:20px;width:3.2em}
.res td b{display:block}
.res td small{color:var(--soft);font-size:13px}
.res tr.now td{background:var(--graph);color:#fff}
.res tr.now small{color:#bdbcb7}
.pos{display:inline-block;min-width:3.2em;text-align:center;font-weight:800;padding:2px 6px;font-variant-numeric:tabular-nums}
.pos.pod{background:var(--champ);color:#1b1d21}
.pos.dnf{color:var(--red);font-size:13px}
.chip{font-size:12px;font-weight:700;padding:3px 10px;white-space:nowrap;border:1px solid var(--line);color:var(--soft)}
tr.now .chip{background:var(--red);border-color:var(--red);color:#fff}
.chip.up{border-color:var(--gold);color:var(--gold)}
.brkrow td{background:var(--panel);text-align:center;font-size:14px;color:var(--soft);font-weight:700;padding:10px}

/* shop */
.cartbtn{flex:none;min-height:44px;padding:0 14px;border:1px solid var(--line);background:var(--bg);font-weight:700;font-size:14px;cursor:pointer;display:flex;align-items:center;gap:8px}
.cartbtn b{background:var(--champ);color:#1b1d21;min-width:22px;height:22px;border-radius:11px;display:grid;place-items:center;font-size:12px;padding:0 6px}
.cfg{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:clamp(24px,4vw,56px);align-items:start}
.cfg .stage{position:relative;background:linear-gradient(180deg,#2a2d33,#16171a);aspect-ratio:916/738;overflow:hidden}
.cfg .stage img{width:100%;height:100%;object-fit:cover;transition:filter .4s}
.cfg .stage.night img{filter:grayscale(.6) brightness(.62) contrast(1.15)}
.cfg .stage .tagno{position:absolute;right:18px;bottom:10px;font-size:clamp(60px,8vw,110px);line-height:1;color:var(--champ)}
.cfg .stage .ed{position:absolute;left:16px;top:16px;background:rgba(20,21,24,.8);color:var(--champ);font-weight:700;font-size:13px;padding:5px 12px}
.opt{border:0;margin:0 0 22px;padding:0}
.opt legend{font-weight:700;font-size:15px;margin-bottom:10px;padding:0}
.choices{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.choices label{display:flex;flex-direction:column;gap:2px;border:1px solid #3a3d44;padding:12px 14px;cursor:pointer;min-height:44px}
.choices label:has(input:checked){border-color:var(--champ);background:rgba(217,194,148,.1)}
.choices input{position:absolute;opacity:0;pointer-events:none}
.choices label:has(input:focus-visible){outline:2px solid var(--champ)}
.choices b{font-size:15px}.choices small{font-size:13px;color:#a9aab0}
.addon{display:flex;gap:12px;align-items:flex-start;padding:12px 0;border-bottom:1px solid #33363c;cursor:pointer}
.addon input{width:20px;height:20px;accent-color:#d9c294;margin-top:3px;flex:none}
.addon span{flex:1}.addon small{display:block;color:#a9aab0;font-size:13px}
.addon em{font-style:normal;font-weight:700;white-space:nowrap}
.numin{width:100%;min-height:48px;font:16px "Noto Sans KR";padding:0 12px;background:#25282d;color:#fff;border:1px solid #3a3d44}
.total{display:flex;justify-content:space-between;align-items:baseline;border-top:2px solid #ecebe7;padding-top:16px;margin:8px 0 16px}
.total b{font-size:clamp(28px,3vw,38px);font-variant-numeric:tabular-nums}
.pg{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:28px 20px}
.pd{display:flex;flex-direction:column;gap:8px}
.pd .pic{aspect-ratio:1;background:var(--panel);display:grid;place-items:center;position:relative;overflow:hidden}
.pd .pic svg{width:72%;height:72%}
.pd .pic img{width:100%;height:100%;object-fit:cover}
.pd .badge{position:absolute;left:10px;top:10px;font-size:12px;font-weight:700;background:var(--graph);color:var(--champ);padding:3px 9px}
.pd .brand{font-size:13px;color:var(--gold);font-weight:700}
.pd h3{margin:0;font-size:17px;line-height:1.4}
.pd p{margin:0;color:var(--soft);font-size:14px}
.pd .row2{display:flex;gap:8px;align-items:center;margin-top:auto;padding-top:6px}
.pd .pr{font-weight:800;font-size:18px;font-variant-numeric:tabular-nums;margin-right:auto;white-space:nowrap}
.pd select{min-height:44px;font:15px "Noto Sans KR";padding:0 8px;border:1px solid var(--line);background:var(--bg);color:var(--ink)}
.add{min-height:44px;padding:0 16px;border:0;background:var(--graph);color:#fff;font-weight:700;cursor:pointer}
.add.done{background:var(--champ);color:#1b1d21}
.perks{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:0;border-top:1px solid var(--line);border-bottom:1px solid var(--line);margin-bottom:40px}
.perks div{padding:16px 16px 16px 0;font-size:15px}.perks b{display:block}.perks span{color:var(--soft);font-size:14px}
.drawer{position:fixed;inset:0;z-index:70;display:none}
.drawer.on{display:block}
.drawer .sh{position:absolute;inset:0;background:rgba(10,11,13,.5)}
.drawer aside{position:absolute;right:0;top:0;bottom:0;width:min(420px,100%);background:var(--bg);display:flex;flex-direction:column;box-shadow:-8px 0 30px rgba(0,0,0,.2)}
.drawer header{display:flex;justify-content:space-between;align-items:center;padding:18px 20px;border-bottom:1px solid var(--line)}
.drawer header h2{margin:0;font-size:20px}
.drawer .x2{min-width:44px;min-height:44px;border:0;background:none;font-weight:700;cursor:pointer}
.items{flex:1;overflow:auto;padding:4px 20px}
